[package]
name = "maud-ui"
version = "0.6.5"
edition = "2021"
license = "MIT"
description = "79 headless, accessible UI components for Rust web apps — shadcn Base UI API parity. Plus block templates, a live theme customiser, and shell hooks for 15 third-party widgets (Monaco, xyflow, Excalidraw, Three.js, AG Grid, Leaflet, FullCalendar, SortableJS, and more). Built on maud + htmx, styled like shadcn/ui."
repository = "https://github.com/hgeldenhuys/maud-ui"
homepage = "https://maudui.herman.engineer"
documentation = "https://docs.rs/maud-ui"
readme = "README.md"
authors = ["Herman Geldenhuys"]
keywords = ["maud", "htmx", "ui", "components", "shadcn"]
categories = ["web-programming", "gui", "template-engine"]
include = [
    "src/**/*.rs",
    # `src/**/*.rs` alone is not enough: src/showcase/landing.css is include_str!'d by
    # landing.rs, and a .css file under src/ matches no other glob here. Without this the
    # PACKAGED crate fails to compile — the local build is fine, so only
    # `cargo publish --dry-run` catches it. It did.
    "src/**/*.css",
    "css/**/*.css",
    "dist/**/*",
    # examples/showcase.rs include_bytes!s the brand assets, so a published
    # crate without them cannot build its own example.
    "assets/**/*",
    "docs/components/**/*.md",
    "examples/showcase.rs",
    # Anchored with "/" — a bare "README.md" glob-matches NESTED readmes and
    # was pulling node_modules/esbuild/README.md into the published crate.
    "/README.md",
    "/LICENSE",
    "/Cargo.toml",
]

[dependencies]
maud = { version = "0.27", features = ["axum"] }
pulldown-cmark = { version = "0.10", default-features = false, features = ["html"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }

[[example]]
name = "showcase"
path = "examples/showcase.rs"
