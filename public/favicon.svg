<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="maud-ui">
  <!--
    maud-ui mark — a brace pair enclosing a block.

    maud's sigil is `html! { }`; the braces ARE the library, and the block
    between them is what you get out. Deliberately typographic rather than
    illustrated: it survives 16x16, needs no asset pipeline, and says
    "template macro" instead of "generic UI kit".

    Theme-aware on purpose. The two colours are this library's own accent
    pair: mui-accent (#2563eb) reads on white, mui-accent-text (#60a5fa)
    reads on near-black. The mark follows the same rule every component
    follows, instead of being a fixed asset bolted on beside them.

    NB: token names are written here without their leading double hyphen.
    XML forbids "- -" (no space) inside a comment, so spelling the custom
    properties in full silently breaks the whole file: the SVG stops
    parsing and every browser renders a broken-image glyph, with no error
    anywhere. Caught only by rendering it.
  -->
  <!--
    Geometry note: an earlier pass drew the braces narrower (x 6..26) with a
    2.75 stroke. Rendered side by side at 16px it was legible but timid, and
    a favicon that reads as a faint smudge in a tab strip is a favicon that
    does not work. This is the wider, heavier draw.
  -->
  <style>
    .brace { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .block { fill: #2563eb; stroke: none; }
    @media (prefers-color-scheme: dark) {
      .brace { stroke: #60a5fa; }
      .block { fill: #60a5fa; }
    }
  </style>
  <path class="brace" d="M13 4 C 9.5 4 10 7.5 10 11 C 10 14.5 7 16 5 16 C 7 16 10 17.5 10 21 C 10 24.5 9.5 28 13 28"/>
  <path class="brace" d="M19 4 C 22.5 4 22 7.5 22 11 C 22 14.5 25 16 27 16 C 25 16 22 17.5 22 21 C 22 24.5 22.5 28 19 28"/>
  <rect class="block" x="13.75" y="13.75" width="4.5" height="4.5" rx="1.1"/>
</svg>
